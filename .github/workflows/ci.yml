name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server, hook, main-process wiring and renderer regressions. None of these
      # need a display: Electron is stubbed and the DOM is simulated.
      - run: npm test
      # The 3D renderer bundle must build, and the GLB models must keep their
      # skeleton and clips (the WebGL screenshot test needs a GPU, so skip it).
      - run: npm run build:3d
      - run: node scripts/check-models.js --assets-only
